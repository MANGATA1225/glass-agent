display_information:
  name: glass-agent
  description: Read-only workspace assistant
  background_color: "#263445"
features:
  bot_user:
    display_name: glass-agent
    always_online: false
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - im:history
      - chat:write
settings:
  socket_mode_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
